services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labelprint
      POSTGRES_PASSWORD: labelprint
      POSTGRES_DB: labelprint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelprint -d labelprint"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DATABASE_URL: postgres://labelprint:labelprint@db:5432/labelprint?sslmode=disable
      ADDR: ":8080"
      ALLOW_REGISTER: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
